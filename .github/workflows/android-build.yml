name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # This project's build.gradle.kts files don't ship a Gradle wrapper,
      # so we install the exact Gradle version AGP 9.1.1 needs and put it on PATH.
      - name: Set up Gradle 9.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.1'
          cache-read-only: false

      # app/build.gradle.kts points the "debug" signing config at
      # ${rootDir}/debug.keystore with alias "androiddebugkey" / password "android".
      # That file is gitignored, so it has to be generated before the build runs.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Optional: if you add a GEMINI_API_KEY secret in the repo settings,
      # it gets baked into BuildConfig.GEMINI_API_KEY. Without it, the app
      # still compiles fine (it just falls back to the .env.example placeholder).
      - name: Create .env file
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: puckvoice-debug-apk
          path: app/build/outputs/apk/debug/*.apk
